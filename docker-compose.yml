name: tbv-sandbox

# Hardened sandbox compose file. Secrets are required from the environment
# (see env.example); there are no working default credentials. All published
# ports bind to 127.0.0.1 so the sandbox is not exposed on the LAN.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: tbv-app:local
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  networks:
    - tbv-sandbox-net

services:
  postgres:
    image: postgres:16-alpine
    container_name: tbv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (no default)}
      POSTGRES_DB: ${POSTGRES_DB:-tbv_identity}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbv} -d ${POSTGRES_DB:-tbv_identity}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - tbv-sandbox-net
    restart: unless-stopped

  migrate:
    <<: *app
    container_name: tbv-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tbv_identity}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m

  key-authority:
    <<: *app
    container_name: tbv-key-authority
    command: ["python", "-m", "demo.node.server"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NODE_ID: key-authority
      PORT: "8000"
      DATA_DIR: /tmp/tbv_data
      DEMO_CLUSTER_KEY_B64: ${DEMO_CLUSTER_KEY_B64:?set DEMO_CLUSTER_KEY_B64 (32 random bytes, base64)}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  detector:
    <<: *app
    container_name: tbv-detector
    command: ["python", "-m", "demo.node.server"]
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      NODE_ID: detector
      PORT: "8005"
      DATA_DIR: /tmp/tbv_data
      DEMO_CLUSTER_KEY_B64: ${DEMO_CLUSTER_KEY_B64:?set DEMO_CLUSTER_KEY_B64 (32 random bytes, base64)}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m

  node-a:
    <<: *app
    container_name: tbv-node-a
    command: ["uvicorn", "src.identity_keys.api:app", "--host", "0.0.0.0", "--port", "8101"]
    ports:
      - "127.0.0.1:8101:8101"
    environment:
      NODE_ID: node-a
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tbv_identity}
      MAX_CACHE_STALENESS_MS: "5000"
      WRAP_MASTER_KEY_B64: ${WRAP_MASTER_KEY_B64:?set WRAP_MASTER_KEY_B64 (32 random bytes, base64)}
      CLUSTER_SYNC_SECRET: ${CLUSTER_SYNC_SECRET:?set CLUSTER_SYNC_SECRET}
      TOKEN_SIGNING_SEED_B64: ${TOKEN_SIGNING_SEED_B64:?set TOKEN_SIGNING_SEED_B64}
      ADMIN_ENROLL_TOKEN: ${ADMIN_ENROLL_TOKEN:?set ADMIN_ENROLL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  node-b:
    <<: *app
    container_name: tbv-node-b
    command: ["uvicorn", "src.identity_keys.api:app", "--host", "0.0.0.0", "--port", "8102"]
    ports:
      - "127.0.0.1:8102:8102"
    environment:
      NODE_ID: node-b
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tbv_identity}
      MAX_CACHE_STALENESS_MS: "5000"
      WRAP_MASTER_KEY_B64: ${WRAP_MASTER_KEY_B64:?set WRAP_MASTER_KEY_B64 (32 random bytes, base64)}
      CLUSTER_SYNC_SECRET: ${CLUSTER_SYNC_SECRET:?set CLUSTER_SYNC_SECRET}
      TOKEN_SIGNING_SEED_B64: ${TOKEN_SIGNING_SEED_B64:?set TOKEN_SIGNING_SEED_B64}
      ADMIN_ENROLL_TOKEN: ${ADMIN_ENROLL_TOKEN:?set ADMIN_ENROLL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  node-c:
    <<: *app
    container_name: tbv-node-c
    command: ["uvicorn", "src.identity_keys.api:app", "--host", "0.0.0.0", "--port", "8103"]
    ports:
      - "127.0.0.1:8103:8103"
    environment:
      NODE_ID: node-c
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tbv_identity}
      MAX_CACHE_STALENESS_MS: "5000"
      WRAP_MASTER_KEY_B64: ${WRAP_MASTER_KEY_B64:?set WRAP_MASTER_KEY_B64 (32 random bytes, base64)}
      CLUSTER_SYNC_SECRET: ${CLUSTER_SYNC_SECRET:?set CLUSTER_SYNC_SECRET}
      TOKEN_SIGNING_SEED_B64: ${TOKEN_SIGNING_SEED_B64:?set TOKEN_SIGNING_SEED_B64}
      ADMIN_ENROLL_TOKEN: ${ADMIN_ENROLL_TOKEN:?set ADMIN_ENROLL_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

volumes:
  pgdata:

networks:
  tbv-sandbox-net:
    driver: bridge
