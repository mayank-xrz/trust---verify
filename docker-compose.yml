version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tbv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}
      POSTGRES_DB: ${POSTGRES_DB:-tbv_identity}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbv} -d ${POSTGRES_DB:-tbv_identity}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tbv-sandbox-net

  key-authority:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-key-authority
    ports:
      - "8000:8000"
    environment:
      - NODE_ID=key-authority
      - DEMO_SANDBOX_ENABLED=1
      - DEMO_OPERATOR_TOKEN=${DEMO_OPERATOR_TOKEN:-}
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tbv-sandbox-net

  detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-detector
    ports:
      - "8005:8005"
    environment:
      - NODE_ID=detector
      - DEMO_SANDBOX_ENABLED=1
      - DEMO_OPERATOR_TOKEN=${DEMO_OPERATOR_TOKEN:-}
      - PORT=8005
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  node-a:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY . /app
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8101
        CMD ["sh", "-c", "alembic upgrade head && uvicorn src.identity_keys.api:app --host 0.0.0.0 --port 8101"]
    container_name: tbv-node-a
    ports:
      - "8101:8101"
      - "8001:8001"
    environment:
      NODE_ID: node-a
      NODE_PORT: 8101
      WRAP_KEY_REF: local-wrap-key-node-a
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}@postgres:5432/${POSTGRES_DB:-tbv_identity}
      MAX_CACHE_STALENESS_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  node-b:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY . /app
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8102
        CMD ["sh", "-c", "uvicorn src.identity_keys.api:app --host 0.0.0.0 --port 8102"]
    container_name: tbv-node-b
    ports:
      - "8102:8102"
      - "8002:8002"
    environment:
      NODE_ID: node-b
      NODE_PORT: 8102
      WRAP_KEY_REF: local-wrap-key-node-b
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}@postgres:5432/${POSTGRES_DB:-tbv_identity}
      MAX_CACHE_STALENESS_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  node-c:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY . /app
        RUN pip install --no-cache-dir -r requirements.txt
        EXPOSE 8103
        CMD ["sh", "-c", "uvicorn src.identity_keys.api:app --host 0.0.0.0 --port 8103"]
    container_name: tbv-node-c
    ports:
      - "8103:8103"
      - "8003:8003"
    environment:
      NODE_ID: node-c
      NODE_PORT: 8103
      WRAP_KEY_REF: local-wrap-key-node-c
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tbv}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Compose}@postgres:5432/${POSTGRES_DB:-tbv_identity}
      MAX_CACHE_STALENESS_MS: 5000
    depends_on:
      postgres:
        condition: service_healthy
      node-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

networks:
  tbv-sandbox-net:
    driver: bridge
