version: "3.8"

services:
  key-authority:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-key-authority
    ports:
      - "8000:8000"
    environment:
      - NODE_ID=key-authority
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-node-a
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=node-a
      - PORT=8001
      - KEY_AUTHORITY_URL=http://key-authority:8000
      - DETECTOR_URL=http://detector:8005
    depends_on:
      key-authority:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-node-b
    ports:
      - "8002:8002"
    environment:
      - NODE_ID=node-b
      - PORT=8002
      - KEY_AUTHORITY_URL=http://key-authority:8000
      - DETECTOR_URL=http://detector:8005
    depends_on:
      key-authority:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  node-c:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-node-c
    ports:
      - "8003:8003"
    environment:
      - NODE_ID=node-c
      - PORT=8003
      - KEY_AUTHORITY_URL=http://key-authority:8000
      - DETECTOR_URL=http://detector:8005
    depends_on:
      key-authority:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

  detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tbv-detector
    ports:
      - "8005:8005"
    environment:
      - NODE_ID=detector
      - PORT=8005
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tbv-sandbox-net

networks:
  tbv-sandbox-net:
    driver: bridge
