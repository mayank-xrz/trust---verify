services:
  - type: web
    name: trust-but-verify
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ID
        value: node-a
      - key: GRACE_PERIOD_SECONDS
        value: "5.0"
      - key: DEMO_SANDBOX_ENABLED
        value: "1"
      - key: DEMO_OPERATOR_TOKEN
        generateValue: true
