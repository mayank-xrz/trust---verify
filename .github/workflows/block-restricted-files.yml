name: Block Restricted Files on Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-clean-main:
    name: Verify No Restricted or Sensitive Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for restricted files
        run: |
          BLOCKED_PATTERN='(^|/)(([aA][gG][eE][nN][tT]|[cC][lL][aA][uU][dD][eE])\.[mM][dD]|\.cursorrules|\.env(\.(local|production|development|staging|test))?|.*\.key|.*\.pem)$|(^|/)(__pycache__|\.venv|dist|build)($|/)'
          
          # Check tracked files in repository
          VIOLATIONS=$(git ls-files | grep -E "$BLOCKED_PATTERN" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Blocked files detected on main!"
            echo "The following forbidden files were found:"
            echo "$VIOLATIONS" | sed 's/^/  - /'
            exit 1
          fi
          echo "✅ All clean: No restricted files found in repository."
