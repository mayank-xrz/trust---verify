name: CI

on:
  push:
    branches: ["main", "krishna"]
  pull_request:
    branches: ["main", "krishna"]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint, Unit Tests & CLI Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.8.0
      - name: Lint with ruff
        run: ruff check src tests track4_service.py
      - name: Run full test suite
        run: pytest -q
      - name: Run doc-check
        run: python -m src.cli doc-check
      - name: Verify audit log CLI self-test
        run: python verify_log.py --chain --checkpoints --self-test
      - name: Run CLI crypto acceptance demos
        run: |
          python -m src.cli demo-replay
          python -m src.cli demo-forward-secrecy
          python -m src.cli demo-chunked-loss
          python -m src.cli demo-resumption-binding

  redteam-and-chaos:
    name: Red-Team, Hardening & Crash-Recovery Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run red-team, hardening, and chaos gates
        run: |
          pytest -q \
            tests/test_judge_redteam.py \
            tests/test_lifecycle_chaos.py \
            tests/test_security_hardening.py \
            tests/test_security_regression.py \
            tests/test_no_hardcoded_secrets.py \
            tests/test_pqc_hardening.py \
            tests/integration/test_brief_scenarios.py
      - name: Run detector evaluation gate
        run: python -m scripts.evaluate_detector

  postgresql:
    name: PostgreSQL 16 Migration & Runtime Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tbv
          POSTGRES_DB: tbv_identity
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbv -d tbv_identity"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://tbv@127.0.0.1:5432/tbv_identity
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://tbv@127.0.0.1:5432/tbv_identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply PostgreSQL migrations
        run: alembic upgrade head
      - name: Exercise PostgreSQL-specific runtime paths
        run: pytest -q tests/integration/test_postgres_runtime.py

  docker:
    name: Docker Build & Read-Only Runtime Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build clean Docker image and capture metadata
        run: >-
          docker buildx build --load --no-cache --progress=plain
          --metadata-file docker-build-metadata.json
          -t trust-verify:ci .
      - name: Record image configuration
        run: docker image inspect trust-verify:ci > docker-image-inspect.json
      - name: Run pytest inside container
        run: docker run --rm --entrypoint python trust-verify:ci -m pytest -q --ignore=tests/test_no_hardcoded_secrets.py
      - name: Verify track4_service.py under read-only rootfs
        run: |
          printf '%s' '{"op":"setup","owners":{"brief":"alice"},"contents":{"brief":"ro body"},"disabled":[]}' \
            | docker run --rm -i --read-only --tmpfs /tmp -e TRACK4_TRUSTED_HARNESS=1 -e TRACK4_STATE_DIR=/tmp/state --entrypoint python trust-verify:ci /app/track4_service.py
          printf '%s' '{"op":"setup","owners":{"brief":"alice"},"contents":{"brief":"ro body"},"disabled":[]}' \
            | docker run --rm -i --read-only --tmpfs /tmp -e TRACK4_TRUSTED_HARNESS=1 --entrypoint python trust-verify:ci /app/track4_service.py
      - name: Confirm no key material or .env in image
        run: |
          docker run --rm --entrypoint sh trust-verify:ci -c \
            'test -z "$(find /app -name "*.key" -o -name "*.pem" -o -name ".env")"'
      - name: Upload reproducible build evidence
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-evidence
          path: |
            docker-build-metadata.json
            docker-image-inspect.json

  validator:
    name: Organizer Toolkit Validator Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Clone official Track 4 Toolkit
        run: git clone --depth 1 https://github.com/ScalerOpenSourceLabs/Track-4-Toolkit.git /tmp/toolkit
      - name: Run organizer validate.py against track4_service.py
        working-directory: /tmp/toolkit
        env:
          TRACK4_TRUSTED_HARNESS: "1"
        run: python validate.py --entry "$GITHUB_WORKSPACE/track4_service.py"
