[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/identity_keys", "track4_service.py", "scripts/seed_sandbox.py", "scripts/fault.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
