[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 is enforced by `ruff format` for code; long string/docstring literals are
# intentionally left intact. Lint therefore does not duplicate the line-length check.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "scripts", "tests", "demo", "track4_service"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/identity_keys", "track4_service.py", "scripts/seed_sandbox.py", "scripts/fault.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
