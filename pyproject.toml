[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501 is enforced by `ruff format` for code; long string/docstring literals are
# intentionally left intact. Lint therefore does not duplicate the line-length check.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/identity_keys", "track4_service.py", "scripts/seed_sandbox.py", "scripts/fault.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Standalone historical sub-projects keep their own import roots and are not
# part of the root suite. They are retained for provenance (see docs/ARCHIVED.md)
# and must be run from their own directories.
norecursedirs = ["role3_logging_detector", "prototypes", ".venv", "build", "dist"]
addopts = "--ignore=role3_logging_detector --ignore=prototypes"
